# Weather-dependent cut height for a Dreame mower, per zone: weather, state, ask-then-apply.
# The decision is in custom_templates/cut_height.jinja; notes in docs/tropical-cut-height-notes.md.
#
# Entities used (replace with yours if they differ; the names are those of a Dreame A1
# on EvotecIT/homeassistant-dreamelawnmower):
#   lawn_mower.a1_2                        the mower
#   calendar.a1_schedule                   the mower's active app schedule, as a calendar
#   binary_sensor.a1_docked                docked
#   select.a1_map_2 / select.a1_zone_2     Home Assistant's map and zone scope (local only;
#                                          changing them does not move or change the mower)
#   number.a1_selected_zone_mowing_height  height of the zone in scope (read back)
#   notify.mobile_app_iphone_17            your phone
#   weather.belgian_gardens                BOM forecast (bureau_of_meteorology integration)
#   sensor.gw3000c_outdoor_temperature,    your weather station (daily history from the
#   sensor.gw3000c_yearly_rain_piezo       recorder's long-term statistics)
# and, in custom_templates/cut_height.jinja, the zone list and the optional sources
# (BOM warnings, Smart Irrigation water balance and your own rain gauge).
#
# Scheduling stays in the Dreame app. An hour before each scheduled mow (read from the
# calendar), the plan is fixed and each zone's height is read; any change is sent to your
# phone as a question. Unless you tap Skip, it is written 5 minutes before the mow while the
# mower is docked, or at its next dock after that, then read back. Skip holds everything for
# 2 days.
#
# Weather comes from Open-Meteo for your Home zone, so no location is stored here.

rest:
  # Open-Meteo (free, no key) for your Home zone: past 21 days + 6 days of forecast.
  - resource_template: >-
      https://api.open-meteo.com/v1/forecast?latitude={{ state_attr('zone.home', 'latitude') | round(2) }}&longitude={{ state_attr('zone.home', 'longitude') | round(2) }}&daily=temperature_2m_mean,temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration&past_days=21&forecast_days=6&timezone=auto
    scan_interval: 3600
    timeout: 30
    sensor:
      - name: Cut height weather
        unique_id: cut_height_weather_open_meteo
        icon: mdi:weather-partly-cloudy
        # State: the newest past day in the data (today's date when fresh).
        value_template: "{{ value_json.daily.time[21] if value_json.daily is defined else none }}"
        json_attributes_path: "$.daily"
        json_attributes:
          - time
          - temperature_2m_mean
          - temperature_2m_max
          - temperature_2m_min
          - precipitation_sum
          - et0_fao_evapotranspiration

template:
  # Plan, readable summaries, and number/switch mirrors of the helpers so the
  # lawn-mower-card can show them as controls (it only renders number/switch/select/time).
  - sensor:
      - name: Cut height plan
        unique_id: cut_height_plan
        icon: mdi:grass
        availability: >
          {% from 'cut_height.jinja' import cut_height_plan_live %}
          {{ 'error' not in (cut_height_plan_live() | from_json) }}
        state: >
          {% from 'cut_height.jinja' import cut_height_plan_live %}
          {{ (cut_height_plan_live() | from_json).why }}
        attributes:
          offset: >
            {% from 'cut_height.jinja' import cut_height_plan_live %}
            {{ (cut_height_plan_live() | from_json).offset }}
          t7: >
            {% from 'cut_height.jinja' import cut_height_plan_live %}
            {{ (cut_height_plan_live() | from_json).t7 }}
          targets: >
            {% from 'cut_height.jinja' import cut_height_plan_live, cut_height_zones, cut_height_zone_want %}
            {% set plan = cut_height_plan_live() | from_json %}
            {% set ns = namespace(out={}) %}
            {% for z in cut_height_zones() | from_json %}
              {% set ns.out = dict(ns.out, **{z.option: cut_height_zone_want(plan.offset, states(z.baseline)) | float}) %}
            {% endfor %}
            {{ ns.out }}
          targets_text: >
            {% from 'cut_height.jinja' import cut_height_plan_live, cut_height_zones, cut_height_zone_want %}
            {% set plan = cut_height_plan_live() | from_json %}
            {% set ns = namespace(out=[]) %}
            {% for z in cut_height_zones() | from_json %}
              {% set ns.out = ns.out + [z.option | regex_replace('\s*\(#\d+\)$', '') ~ ' ' ~ (cut_height_zone_want(plan.offset, states(z.baseline)) | float) ~ ' cm'] %}
            {% endfor %}
            {{ ns.out | join(', ') }}
          plan: >
            {% from 'cut_height.jinja' import cut_height_plan_live %}
            {{ cut_height_plan_live() | from_json }}
      - name: Cut height next change
        unique_id: cut_height_next_change
        default_entity_id: sensor.cut_height_next_change
        icon: mdi:swap-vertical
        state: >
          {% set p = states('input_text.cut_height_pending') | from_json(default=[]) %}
          {% if p | count == 0 %}None pending
          {% else %}{% for c in p %}{{ c.option | regex_replace('\s*\(#\d+\)$', '') }} {{ c['from'] }} → {{ c.to }} cm{{ ', ' if not loop.last }}{% endfor %}{% endif %}
  - switch:
      - name: Smart cut height
        unique_id: cut_height_smart_switch
        default_entity_id: switch.cut_height_smart
        icon: mdi:robot-mower-outline
        state: "{{ is_state('automation.cut_height_check_before_mowing', 'on') }}"
        turn_on:
          - action: automation.turn_on
            target:
              entity_id:
                - automation.cut_height_check_before_mowing
                - automation.cut_height_apply
        turn_off:
          - action: automation.turn_off
            target:
              entity_id:
                - automation.cut_height_check_before_mowing
                - automation.cut_height_apply
  - number:
      - name: Raised Lawn usual height
        unique_id: cut_height_number_baseline_zone_1
        default_entity_id: number.cut_height_baseline_zone_1
        icon: mdi:target
        unit_of_measurement: "cm"
        min: 3
        max: 7
        step: 0.5
        state: "{{ states('input_number.cut_height_baseline_zone_1') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_baseline_zone_1
            data:
              value: "{{ value }}"
      - name: After heavy rain
        unique_id: cut_height_number_rain_offset
        default_entity_id: number.cut_height_rain_offset
        icon: mdi:weather-pouring
        unit_of_measurement: "cm"
        min: -2
        max: 0
        step: 0.5
        state: "{{ states('input_number.cut_height_rain_offset') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_rain_offset
            data:
              value: "{{ value }}"
      - name: Heat or dry spell
        unique_id: cut_height_number_hot_offset
        default_entity_id: number.cut_height_hot_offset
        icon: mdi:weather-sunny-alert
        unit_of_measurement: "cm"
        min: 0
        max: 2
        step: 0.5
        state: "{{ states('input_number.cut_height_hot_offset') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_hot_offset
            data:
              value: "{{ value }}"
      - name: Heatwave
        unique_id: cut_height_number_heatwave_offset
        default_entity_id: number.cut_height_heatwave_offset
        icon: mdi:thermometer-alert
        unit_of_measurement: "cm"
        min: 0
        max: 3
        step: 0.5
        state: "{{ states('input_number.cut_height_heatwave_offset') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_heatwave_offset
            data:
              value: "{{ value }}"
      - name: Dry season
        unique_id: cut_height_number_dry_season_offset
        default_entity_id: number.cut_height_dry_season_offset
        icon: mdi:weather-sunny
        unit_of_measurement: "cm"
        min: 0
        max: 2
        step: 0.5
        state: "{{ states('input_number.cut_height_dry_season_offset') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_dry_season_offset
            data:
              value: "{{ value }}"
      - name: Hot day from
        unique_id: cut_height_number_hot_max_temp
        default_entity_id: number.cut_height_hot_max_temp
        icon: mdi:thermometer-high
        unit_of_measurement: "°C"
        min: 28
        max: 42
        step: 0.5
        state: "{{ states('input_number.cut_height_hot_max_temp') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_hot_max_temp
            data:
              value: "{{ value }}"
      - name: Heatwave 3-day mean from
        unique_id: cut_height_number_heatwave_temp
        default_entity_id: number.cut_height_heatwave_temp
        icon: mdi:thermometer-alert
        unit_of_measurement: "°C"
        min: 24
        max: 36
        step: 0.5
        state: "{{ states('input_number.cut_height_heatwave_temp') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_heatwave_temp
            data:
              value: "{{ value }}"
      - name: Heavy rain from
        unique_id: cut_height_number_heavy_rain
        default_entity_id: number.cut_height_heavy_rain
        icon: mdi:weather-pouring
        unit_of_measurement: "mm"
        min: 5
        max: 150
        step: 5
        state: "{{ states('input_number.cut_height_heavy_rain') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_heavy_rain
            data:
              value: "{{ value }}"
      - name: Growing season from
        unique_id: cut_height_number_grow_temp
        default_entity_id: number.cut_height_grow_temp
        icon: mdi:sprout
        unit_of_measurement: "°C"
        min: 15
        max: 30
        step: 0.5
        state: "{{ states('input_number.cut_height_grow_temp') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_grow_temp
            data:
              value: "{{ value }}"
      - name: Dry at water balance
        unique_id: cut_height_number_dry_bucket
        default_entity_id: number.cut_height_dry_bucket
        icon: mdi:water-minus
        unit_of_measurement: "mm"
        min: -60
        max: 0
        step: 1
        state: "{{ states('input_number.cut_height_dry_bucket') }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.cut_height_dry_bucket
            data:
              value: "{{ value }}"

  # BOM daily forecast for the lawn (bureau_of_meteorology integration), refreshed every
  # 30 minutes. Its max/min replace Open-Meteo's for today and the days ahead.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: "/30"
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.belgian_gardens
        data:
          type: daily
        response_variable: bom
    sensor:
      - name: Cut height BOM forecast
        unique_id: cut_height_bom_forecast
        default_entity_id: sensor.cut_height_bom_forecast
        icon: mdi:weather-partly-cloudy
        state: "{{ bom['weather.belgian_gardens'].forecast | count }}"
        attributes:
          forecast: >
            {% set ns = namespace(out=[]) %}
            {% for f in bom['weather.belgian_gardens'].forecast %}
              {% set ns.out = ns.out + [dict(date=f.datetime[:10], max=f.temperature | default(none), min=f.templow | default(none), rain=f.precipitation | default(none))] %}
            {% endfor %}
            {{ ns.out }}

  # Your weather station's daily max/min/mean temperature and rain for the past 22 days,
  # from Home Assistant's long-term statistics. Replaces Open-Meteo for past days.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: "7"
    actions:
      - action: recorder.get_statistics
        data:
          start_time: "{{ (now() - timedelta(days=22)).strftime('%Y-%m-%d 00:00:00') }}"
          statistic_ids:
            - sensor.gw3000c_outdoor_temperature
            - sensor.gw3000c_yearly_rain_piezo
          period: day
          types:
            - max
            - min
            - mean
            - change
        response_variable: st
    sensor:
      - name: Cut height station history
        unique_id: cut_height_station_history
        default_entity_id: sensor.cut_height_station_history
        icon: mdi:weather-cloudy-clock
        state: "{{ st.statistics.get('sensor.gw3000c_outdoor_temperature', []) | count }}"
        attributes:
          days: >
            {% set t = st.statistics.get('sensor.gw3000c_outdoor_temperature', []) %}
            {% set r = st.statistics.get('sensor.gw3000c_yearly_rain_piezo', []) %}
            {% set ns = namespace(out=[]) %}
            {% for d in t %}
              {% set rr = r | selectattr('start', 'eq', d.start) | map(attribute='change') | list %}
              {% set ns.out = ns.out + [dict(date=(d.start | as_datetime | as_local).date() | string, max=d.max | default(none), min=d.min | default(none), mean=(d.mean | round(2)) if d.mean is number else none, rain=(rr[0] | round(1)) if rr and rr[0] is number else none)] %}
            {% endfor %}
            {{ ns.out }}

input_number:
  # Each zone's usual height (cm). Add one per zone listed in cut_height_zones().
  cut_height_baseline_zone_1:
    name: Cut height baseline Raised Lawn
    min: 3
    max: 7
    step: 0.5
    unit_of_measurement: cm
    icon: mdi:target
  # Offsets added to every zone's baseline (cm).
  cut_height_rain_offset:
    name: Cut height offset after heavy rain
    min: -2
    max: 0
    step: 0.5
    unit_of_measurement: cm
    icon: mdi:weather-pouring
  cut_height_hot_offset:
    name: Cut height offset in heat or a dry spell
    min: 0
    max: 2
    step: 0.5
    unit_of_measurement: cm
    icon: mdi:weather-sunny-alert
  cut_height_heatwave_offset:
    name: Cut height offset in a heatwave
    min: 0
    max: 3
    step: 0.5
    unit_of_measurement: cm
    icon: mdi:thermometer-alert
  cut_height_dry_season_offset:
    name: Cut height offset in the dry season (May-Sep)
    min: 0
    max: 2
    step: 0.5
    unit_of_measurement: cm
    icon: mdi:weather-sunny
  # Weather thresholds.
  cut_height_grow_temp:
    name: Cut height growing season above (7-day mean)
    min: 15
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
  cut_height_heavy_rain:
    name: Cut height heavy rain (3 days, or 24 h at your gauge)
    min: 5
    max: 150
    step: 5
    unit_of_measurement: mm
  cut_height_hot_max_temp:
    name: Cut height hot if daily max at least
    min: 28
    max: 42
    step: 0.5
    unit_of_measurement: "°C"
  cut_height_heatwave_temp:
    name: Cut height heatwave if 3-day mean at least
    min: 24
    max: 36
    step: 0.5
    unit_of_measurement: "°C"
  cut_height_dry_bucket:
    name: Cut height dry if water balance at or below
    min: -60
    max: 0
    step: 1
    unit_of_measurement: mm
  cut_height_dry_deficit:
    name: Cut height dry spell at 21-day deficit (no water balance)
    min: 20
    max: 150
    step: 5
    unit_of_measurement: mm

input_boolean:
  cut_height_dry_spell:
    name: Cut height dry spell
    icon: mdi:water-off
  cut_height_apply_due:
    name: Cut height change due
    icon: mdi:clock-check

input_datetime:
  cut_height_rain_until:
    name: Cut height low after rain until
    has_date: true
    has_time: false
  cut_height_heat_until:
    name: Cut height heat hold until
    has_date: true
    has_time: false
  cut_height_heatwave_until:
    name: Cut height heatwave hold until
    has_date: true
    has_time: false
  cut_height_last_lower:
    name: Cut height last lowered
    has_date: true
    has_time: false
  cut_height_skip_until:
    name: Cut height skip until
    has_date: true
    has_time: true

input_text:
  # Changes waiting to be applied, as JSON: [{"id": 1, "option": "...", "from": 3.5, "to": 4.0}].
  cut_height_pending:
    name: Cut height pending changes
    max: 255
    initial: "[]"

script:
  cut_height_read_heights:
    alias: Cut height - read zone heights
    description: >-
      Puts Home Assistant's map scope on the mowing map, then each managed zone in turn,
      and returns the height the mower reports for each. Only Home Assistant's own
      selection changes; nothing is sent to the mower.
    mode: queued
    fields:
      map_option:
        description: The map's option in select.a1_map_2
        default: Back Yard (#2)
    sequence:
      - variables:
          map_option: "{{ map_option | default('Back Yard (#2)') }}"
          heights: {}
      - if:
          - condition: template
            value_template: "{{ not is_state('select.a1_map_2', map_option) }}"
        then:
          - action: select.select_option
            target:
              entity_id: select.a1_map_2
            data:
              option: "{{ map_option }}"
          - wait_template: "{{ is_state('select.a1_map_2', map_option) }}"
            timeout: "00:00:30"
      - repeat:
          for_each: >
            {% from 'cut_height.jinja' import cut_height_zones %}
            {{ cut_height_zones() | from_json }}
          sequence:
            - action: select.select_option
              target:
                entity_id: select.a1_zone_2
              data:
                option: "{{ repeat.item.option }}"
            - wait_template: >
                {{ state_attr('number.a1_selected_zone_mowing_height', 'selected_zone_id') == repeat.item.id
                   and has_value('number.a1_selected_zone_mowing_height') }}
              timeout: "00:00:30"
            - variables:
                heights: >
                  {% if wait.completed %}
                    {{ dict(heights, **{repeat.item.id | string: states('number.a1_selected_zone_mowing_height') | float}) }}
                  {% else %}{{ heights }}{% endif %}
      - variables:
          result:
            heights: "{{ heights }}"
      - stop: Heights read
        response_variable: result

  cut_height_notify:
    alias: Cut height - notify
    mode: queued
    fields:
      message:
        description: Text
      ask:
        description: Add Apply now / Skip buttons
    sequence:
      - if:
          - condition: template
            value_template: "{{ ask | default(false) | bool }}"
        then:
          - action: notify.mobile_app_iphone_17
            data:
              title: Mower cut height
              message: "{{ message }}"
              data:
                tag: cut_height
                actions:
                  - action: CUT_HEIGHT_APPLY_NOW
                    title: Apply now
                  - action: CUT_HEIGHT_SKIP
                    title: Skip 2 days
        else:
          - action: notify.mobile_app_iphone_17
            data:
              title: Mower cut height
              message: "{{ message }}"
              data:
                tag: cut_height

  cut_height_skip:
    alias: Cut height - skip 2 days
    description: Hold all cut-height changes for 2 days and drop anything pending.
    mode: single
    icon: mdi:calendar-remove
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cut_height_skip_until
        data:
          datetime: "{{ (now() + timedelta(days=2)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.cut_height_pending
        data:
          value: "[]"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cut_height_apply_due

automation:
  - id: cut_height_check
    alias: Cut height - check before mowing
    description: An hour before each scheduled mow, fix the plan, update its state, ask about any change.
    mode: single
    triggers:
      - trigger: calendar
        event: start
        entity_id: calendar.a1_schedule
        offset: "-01:00:00"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.cut_height_plan') }}"
    actions:
      - variables:
          plan: "{{ state_attr('sensor.cut_height_plan', 'plan') }}"
          skipping: "{{ as_timestamp(states('input_datetime.cut_height_skip_until'), 0) > as_timestamp(now()) }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cut_height_apply_due
      - action: "input_boolean.turn_{{ 'on' if plan.dry else 'off' }}"
        target:
          entity_id: input_boolean.cut_height_dry_spell
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cut_height_rain_until
        data:
          date: "{{ plan.rain_until }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cut_height_heat_until
        data:
          date: "{{ plan.heat_until }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cut_height_heatwave_until
        data:
          date: "{{ plan.wave_until }}"
      - action: script.cut_height_read_heights
        response_variable: read
      - variables:
          pending: >
            {% from 'cut_height.jinja' import cut_height_zones, cut_height_zone_next %}
            {% set ns = namespace(out=[]) %}
            {% for z in cut_height_zones() | from_json %}
              {% set h = read.heights.get(z.id | string) %}
              {% if h is number %}
                {% set nxt = cut_height_zone_next(plan.offset, plan.can_lower, states(z.baseline), h) | float %}
                {% if nxt != h %}
                  {% set ns.out = ns.out + [dict(id=z.id, option=z.option, **{'from': h, 'to': nxt})] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          unread: >
            {% from 'cut_height.jinja' import cut_height_zones %}
            {{ cut_height_zones() | from_json | rejectattr('id', 'in', read.heights.keys() | map('int') | list)
               | map(attribute='option') | list }}
      - if:
          - condition: template
            value_template: "{{ unread | count > 0 }}"
        then:
          - action: script.cut_height_notify
            data:
              message: "Couldn't read the height of {{ unread | join(', ') }}; left as it is."
      - if:
          - condition: template
            value_template: "{{ skipping or pending | count == 0 }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.cut_height_pending
            data:
              value: "[]"
          - stop: Nothing to change (or skipped)
      - action: input_text.set_value
        target:
          entity_id: input_text.cut_height_pending
        data:
          value: "{{ pending | to_json }}"
      - action: script.cut_height_notify
        data:
          ask: true
          message: >-
            {% for c in pending %}{{ c.option }}: {{ c['from'] }} → {{ c.to }} cm. {% endfor %}
            ({{ plan.why }}; 7-day mean {{ plan.t7 }} °C, rain {{ plan.rain3 }} mm in 3 days).
            Happens at {{ (as_datetime(trigger.calendar_event.start) - timedelta(minutes=5)) | as_local | as_timestamp | timestamp_custom('%H:%M') }}
            while the mower is docked unless you skip.

  - id: cut_height_apply
    alias: Cut height - apply
    description: 5 min before the mow (or Apply now, or the mower's next dock) write the heights and read them back.
    mode: single
    triggers:
      - trigger: calendar
        event: start
        entity_id: calendar.a1_schedule
        offset: "-00:05:00"
        id: due
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: CUT_HEIGHT_APPLY_NOW
        id: due
      - trigger: state
        entity_id: binary_sensor.a1_docked
        to: "on"
        for: "00:02:00"
        id: docked
    conditions:
      - condition: template
        value_template: "{{ states('input_text.cut_height_pending') not in ['[]', '', 'unknown', 'unavailable'] }}"
    actions:
      - if:
          - condition: trigger
            id: due
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.cut_height_apply_due
      - condition: state
        entity_id: input_boolean.cut_height_apply_due
        state: "on"
      - condition: state
        entity_id: binary_sensor.a1_docked
        state: "on"
      - variables:
          pending: "{{ states('input_text.cut_height_pending') | from_json }}"
      # Puts the map scope on the mowing map: the write goes to the selected map's zones.
      - action: script.cut_height_read_heights
        response_variable: before
      - repeat:
          for_each: "{{ pending }}"
          sequence:
            - action: dreame_lawn_mower.plan_zone_mowing_preference_update
              target:
                entity_id: lawn_mower.a1_2
              data:
                zone_id: "{{ repeat.item.id }}"
                mowing_height_cm: "{{ repeat.item.to }}"
                execute: true
                confirm_preference_write: true
      # Give the integration time to fetch the mower's preferences again, then read back.
      - delay: "00:02:00"
      - action: script.cut_height_read_heights
        response_variable: after
      - variables:
          failed: >
            {% set ns = namespace(out=[]) %}
            {% for c in pending %}
              {% set got = after.heights.get(c.id | string) %}
              {% if got is not number or got != c.to | float %}
                {% set ns.out = ns.out + [c.option ~ ' (wanted ' ~ c.to ~ ', reports ' ~ (got if got is number else 'nothing') ~ ')'] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          lowered: >
            {% set ns = namespace(any=false) %}
            {% for c in pending %}
              {% if c.to | float < c['from'] | float and after.heights.get(c.id | string) == c.to | float %}
                {% set ns.any = true %}
              {% endif %}
            {% endfor %}
            {{ ns.any }}
      - if:
          - condition: template
            value_template: "{{ failed | count > 0 }}"
        then:
          - action: script.cut_height_notify
            data:
              message: >-
                Couldn't set {{ failed | join('; ') }} cm. Set it in the Dreame app; the
                check before the next mow will otherwise try again.
      - if:
          - condition: template
            value_template: "{{ lowered }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.cut_height_last_lower
            data:
              date: "{{ now().date() }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.cut_height_pending
        data:
          value: "[]"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cut_height_apply_due

  - id: cut_height_skip
    alias: Cut height - skip 2 days
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: CUT_HEIGHT_SKIP
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cut_height_skip_until
        data:
          datetime: "{{ (now() + timedelta(days=2)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.cut_height_pending
        data:
          value: "[]"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cut_height_apply_due
