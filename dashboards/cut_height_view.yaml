# A dashboard view with everything for the cut height on one screen: what it plans now,
# each zone's switch and usual height, the adjustments and thresholds, the weather it's
# working from, and a history of changes. Add it as a view (Edit dashboard > Raw
# configuration editor, under views:).
#
# Entity IDs: the integration's start with smart_cut_height_ and use your zone names from
# the Dreame app (raised_lawn, orchard, ...). The weather, warnings, Smart Irrigation and
# rain-gauge tiles are this garden's; replace or delete them.
icon: mdi:ruler
max_columns: 3
path: cut-height
sections:
- cards:
  - heading: Now
    heading_style: title
    icon: mdi:grass
    type: heading
  - type: tile
    entity: switch.smart_cut_height
    name: Smart cut height (master)
    features:
    - type: toggle
    grid_options:
      columns: 6
  - type: tile
    entity: switch.smart_cut_height_write_to_mower
    name: Write to mower
    features:
    - type: toggle
    grid_options:
      columns: 6
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    name: Weather condition
    type: tile
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    icon: mdi:ruler
    name: Target heights
    state_content: targets_text
    type: tile
  - entity: number.a1_selected_zone_mowing_height
    grid_options:
      columns: 6
    icon: mdi:robot-mower
    name: Mower reports
    state_content:
    - selected_zone_label
    - state
    type: tile
  - entity: sensor.smart_cut_height_next_change
    grid_options:
      columns: 6
    name: Next change
    type: tile
  - entity: calendar.a1_schedule
    grid_options:
      columns: 12
    icon: mdi:calendar-clock
    name: Next mow (checks an hour before)
    state_content: start_time
    type: tile
  - entity: button.smart_cut_height_check_now
    grid_options:
      columns: 6
    name: Check now
    type: tile
    hide_state: true
  - entity: button.smart_cut_height_skip_2_days
    grid_options:
      columns: 6
    name: Skip 2 days
    type: tile
    hide_state: true
    tap_action:
      action: perform-action
      confirmation:
        text: Hold cut-height changes for 2 days?
      perform_action: button.press
      target:
        entity_id: button.smart_cut_height_skip_2_days
  type: grid
- cards:
  - type: heading
    heading: Zones
    heading_style: title
    icon: mdi:texture-box
  - type: heading
    heading: Only switched-on zones are read or changed
    heading_style: subtitle
  - type: tile
    entity: switch.smart_cut_height_raised_lawn_smart_control
    name: Raised Lawn
    features:
    - type: toggle
    grid_options:
      columns: 6
  - type: tile
    entity: number.smart_cut_height_raised_lawn_usual_height
    name: Usual height
    features:
    - type: numeric-input
      style: buttons
    grid_options:
      columns: 6
  - type: tile
    entity: switch.smart_cut_height_orchard_smart_control
    name: Orchard
    features:
    - type: toggle
    grid_options:
      columns: 6
  - type: tile
    entity: number.smart_cut_height_orchard_usual_height
    name: Usual height
    features:
    - type: numeric-input
      style: buttons
    grid_options:
      columns: 6
  - type: tile
    entity: switch.smart_cut_height_front_yard_smart_control
    name: Front Yard
    features:
    - type: toggle
    grid_options:
      columns: 6
  - type: tile
    entity: number.smart_cut_height_front_yard_usual_height
    name: Usual height
    features:
    - type: numeric-input
      style: buttons
    grid_options:
      columns: 6
  - type: tile
    entity: switch.smart_cut_height_nature_strip_smart_control
    name: Nature Strip
    features:
    - type: toggle
    grid_options:
      columns: 6
  - type: tile
    entity: number.smart_cut_height_nature_strip_usual_height
    name: Usual height
    features:
    - type: numeric-input
      style: buttons
    grid_options:
      columns: 6
  type: grid
- type: grid
  cards:
  - type: heading
    heading: Adjustments
    heading_style: title
    icon: mdi:tune-vertical
  - type: heading
    heading: Added to each managed zone's usual height
    heading_style: subtitle
  - entity: number.smart_cut_height_after_heavy_rain
    features:
    - style: buttons
      type: numeric-input
    grid_options:
      columns: 12
    name: After heavy rain (wet season)
    type: tile
  - entity: number.smart_cut_height_dry_season
    features:
    - style: buttons
      type: numeric-input
    grid_options:
      columns: 12
    name: Dry season (May to Sep)
    type: tile
  - entity: number.smart_cut_height_heat_or_dry_spell
    features:
    - style: buttons
      type: numeric-input
    grid_options:
      columns: 12
    name: Heat or dry spell
    type: tile
  - entity: number.smart_cut_height_heatwave
    features:
    - style: buttons
      type: numeric-input
    grid_options:
      columns: 12
    name: Heatwave
    type: tile
- cards:
  - heading: Thresholds
    heading_style: title
    icon: mdi:tune-variant
    type: heading
  - entities:
    - entity: number.smart_cut_height_hot_day_from
      name: 'Hot day: forecast max from'
    - entity: number.smart_cut_height_heatwave_3_day_mean_from
      name: 'Heatwave: 3-day mean from'
    - entity: number.smart_cut_height_heavy_rain_from
      name: Heavy rain from (3 days or 24 h)
    - entity: number.smart_cut_height_growing_season_from
      name: Rain drop needs 7-day mean of
    - entity: number.smart_cut_height_dry_at_water_balance
      name: Dry spell at water balance
    - entity: number.smart_cut_height_dry_spell_deficit_from
      name: Dry spell fallback (21-day deficit)
    show_header_toggle: false
    type: entities
  type: grid
- cards:
  - heading: Weather it's using
    heading_style: title
    icon: mdi:weather-partly-cloudy
    type: heading
  - entity: weather.belgian_gardens
    forecast_type: daily
    name: BOM Belgian Gardens
    show_current: true
    show_forecast: true
    type: weather-forecast
  - entity: sensor.smart_cut_height_7_day_mean_temperature
    grid_options:
      columns: 6
    name: 7-day mean
    type: tile
  - entity: sensor.smart_cut_height_rain_over_3_days
    grid_options:
      columns: 6
    name: Rain, 3 days
    type: tile
  - entity: sensor.belgian_gardens_warnings
    grid_options:
      columns: 6
    name: BOM warnings
    type: tile
  - entity: sensor.smart_irrigation_raised_lawn_bucket
    grid_options:
      columns: 6
    name: Raised Lawn water balance
    type: tile
  - entity: sensor.gw3000c_24h_rain_piezo
    grid_options:
      columns: 6
    name: Rain, last 24 h (gauge)
    type: tile
  - type: tile
    entity: sensor.smart_cut_height_weather_station_days_used
    name: Station days used
    grid_options:
      columns: 6
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    name: Dry spell
    icon: mdi:water-off-outline
    state_content: dry_spell
    type: tile
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    name: Low after rain until
    icon: mdi:weather-pouring
    state_content: rain_until
    type: tile
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    name: Heat hold until
    icon: mdi:thermometer-high
    state_content: heat_until
    type: tile
  - entity: sensor.smart_cut_height_weather_plan
    grid_options:
      columns: 6
    name: Heatwave hold until
    icon: mdi:fire
    state_content: wave_until
    type: tile
  column_span: 2
  type: grid
- cards:
  - heading: History
    heading_style: title
    icon: mdi:history
    type: heading
  - entities:
    - sensor.smart_cut_height_weather_plan
    - sensor.smart_cut_height_next_change
    - number.a1_selected_zone_mowing_height
    - switch.smart_cut_height
    - switch.smart_cut_height_write_to_mower
    - switch.smart_cut_height_raised_lawn_smart_control
    - button.smart_cut_height_skip_2_days
    hours_to_show: 336
    type: logbook
  type: grid
title: Cut height
type: sections
