# The Dreame lawn-mower-card (EvotecIT/lovelace-lawn-mower-card) with zone choice and
# the smart cut-height settings added. Paste into a dashboard (Edit > Add card > Manual),
# or merge the keys below the comment into your existing card.
#
# Why control_entities: with automatic discovery the card only shows the zone selector
# when the mowing action is "Zone", so on "All area" there is no way to pick which zone's
# height you're editing. Listing the zone selector and the zone height explicitly keeps
# them in the Mower settings sheet whatever the action is. controls_mode: append keeps
# the card's own discovered controls (schedules, device settings) after these.
#
# The card renders only number, switch, select and time entities as controls, so the
# package mirrors its input_number helpers as number.cut_height_* entities, and the
# automations as switch.cut_height_smart (master) and switch.cut_height_zone_N (per zone).
type: custom:lawn-mower-card
entity: lawn_mower.a1_2
layout: hero
hero_layout: cinematic
grid_options:
  columns: full
battery_entity: sensor.a1_battery_2
map_entity: camera.a1_map
progress_entity: sensor.a1_mowing_progress_2
coverage_entity: sensor.a1_runtime_current_area
coverage_total_entity: sensor.a1_runtime_total_area
# --- added for zone choice and smart cut height ---
controls_mode: append
control_entities:
  - select.a1_map_2
  - select.a1_zone_2
  - number.a1_selected_zone_mowing_height
  - switch.cut_height_smart
  - switch.cut_height_zone_1
  - switch.cut_height_zone_2
  - switch.cut_height_zone_3
  - switch.cut_height_zone_4
  - number.cut_height_baseline_zone_1
  - number.cut_height_rain_offset
  - number.cut_height_hot_offset
  - number.cut_height_heatwave_offset
  - number.cut_height_dry_season_offset
  - number.cut_height_hot_max_temp
  - number.cut_height_heatwave_temp
  - number.cut_height_heavy_rain
  - number.cut_height_grow_temp
  - number.cut_height_dry_bucket
tiles:
  - entity: sensor.cut_height_managed_zones
    label: Smart cut height on
    icon: mdi:texture-box
  - entity: sensor.cut_height_plan
    label: Weather
    icon: mdi:grass
    show_unavailable: true
  - entity: sensor.cut_height_plan
    attribute: targets_text
    label: Target height
    icon: mdi:ruler
  - entity: sensor.cut_height_next_change
    label: Next change
    icon: mdi:swap-vertical
actions:
  - type: service
    label: Skip height changes 2 days
    icon: mdi:calendar-remove
    service: script.turn_on
    service_data:
      entity_id: script.cut_height_skip
    confirmation: Hold cut-height changes for 2 days?
