# The Dreame lawn-mower-card (EvotecIT/lovelace-lawn-mower-card) with zone choice and the
# smart cut-height controls added. Paste into a dashboard (Edit > Add card > Manual), or
# merge the keys below the "added" comment into your existing card.
#
# Entity IDs: the integration's are named after its device ("Smart cut height") and your
# zone names from the Dreame app; replace raised_lawn with yours. The mower's are from the
# Dreame lawn mower integration; replace a1 / _2 with yours.
#
# Why control_entities: with automatic discovery the card shows the zone selector only
# when the mowing action is "Zone". Listing the selectors and the zone height keeps them
# in the Mower settings sheet whatever the action. controls_mode: append keeps the card's
# own discovered controls after these. The card renders number, switch, select and time
# entities as controls, which is what the integration provides.
type: custom:lawn-mower-card
entity: lawn_mower.a1_2
layout: hero
hero_layout: cinematic
grid_options:
  columns: full
battery_entity: sensor.a1_battery_2
map_entity: camera.a1_map
progress_entity: sensor.a1_mowing_progress_2
coverage_entity: sensor.a1_runtime_current_area
coverage_total_entity: sensor.a1_runtime_total_area
# --- added for zone choice and smart cut height ---
controls_mode: append
control_entities:
  - select.a1_map_2
  - select.a1_zone_2
  - number.a1_selected_zone_mowing_height
  - switch.smart_cut_height
  - switch.smart_cut_height_raised_lawn_smart_control
  - number.smart_cut_height_raised_lawn_usual_height
  - number.smart_cut_height_after_heavy_rain
  - number.smart_cut_height_heat_or_dry_spell
  - number.smart_cut_height_heatwave
  - number.smart_cut_height_dry_season
tiles:
  - entity: sensor.smart_cut_height_managed_zones
    label: Smart cut height on
    icon: mdi:texture-box
  - entity: sensor.smart_cut_height_weather_plan
    label: Weather
    icon: mdi:grass
    show_unavailable: true
  - entity: sensor.smart_cut_height_weather_plan
    attribute: targets_text
    label: Target height
    icon: mdi:ruler
  - entity: sensor.smart_cut_height_next_change
    label: Next change
    icon: mdi:swap-vertical
actions:
  - type: service
    label: Skip height changes 2 days
    icon: mdi:calendar-remove
    service: button.press
    service_data:
      entity_id: button.smart_cut_height_skip_2_days
    confirmation: Hold cut-height changes for 2 days?
