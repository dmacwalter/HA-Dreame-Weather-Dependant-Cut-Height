<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sunny on the left, stormy on the right -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.42" stop-color="#7cc4f0"/>
      <stop offset="0.62" stop-color="#5d7898"/>
      <stop offset="1" stop-color="#2c3a52"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fcf4a"/>
      <stop offset="1" stop-color="#2f8f2a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4dbe3"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a97ab"/>
      <stop offset="1" stop-color="#4b566a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c3cf"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sky)"/>

    <!-- Sun -->
    <g transform="translate(130 140)">
      <g stroke="#ffb020" stroke-width="16" stroke-linecap="round">
        <line x1="0" y1="-84" x2="0" y2="-62"/>
        <line x1="0" y1="62" x2="0" y2="84"/>
        <line x1="-84" y1="0" x2="-62" y2="0"/>
        <line x1="62" y1="0" x2="84" y2="0"/>
        <line x1="-59" y1="-59" x2="-44" y2="-44"/>
        <line x1="44" y1="44" x2="59" y2="59"/>
        <line x1="-59" y1="59" x2="-44" y2="44"/>
        <line x1="44" y1="-44" x2="59" y2="-59"/>
      </g>
      <circle r="46" fill="#ffc531"/>
      <circle r="46" fill="none" stroke="#ff9f1a" stroke-width="6"/>
    </g>

    <!-- Storm cloud with rain and lightning -->
    <g>
      <g stroke="#9fd0ff" stroke-width="8" stroke-linecap="round" opacity="0.9">
        <line x1="322" y1="212" x2="310" y2="240"/>
        <line x1="356" y1="212" x2="344" y2="240"/>
        <line x1="432" y1="212" x2="420" y2="240"/>
      </g>
      <path d="M286 200 a44 44 0 0 1 10 -86 a62 62 0 0 1 118 -14 a48 48 0 0 1 52 52 a46 46 0 0 1 -22 48 z"
            fill="url(#cloud)" stroke="#3a4456" stroke-width="5" stroke-linejoin="round"/>
      <path d="M392 190 l-34 54 h26 l-18 50 l50 -66 h-28 l22 -38 z"
            fill="#ffd400" stroke="#d99a00" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Lawn -->
    <path d="M16 372 Q 140 340 256 356 T 496 350 V 496 H 16 Z" fill="url(#grass)"/>
    <g fill="#8ee05e">
      <path d="M52 380 l8 -30 l6 30 z"/>
      <path d="M78 378 l6 -24 l8 24 z"/>
      <path d="M440 372 l8 -28 l6 28 z"/>
      <path d="M466 370 l6 -22 l8 22 z"/>
    </g>

    <!-- Robot mower (generic: body, lidar turret, wheels) -->
    <g transform="translate(-34 4)">
      <ellipse cx="236" cy="422" rx="150" ry="16" fill="#1f5e1c" opacity="0.45"/>
      <circle cx="146" cy="396" r="40" fill="#22262d"/>
      <circle cx="146" cy="396" r="17" fill="#6a7380"/>
      <circle cx="340" cy="406" r="22" fill="#22262d"/>
      <circle cx="340" cy="406" r="8" fill="#6a7380"/>
      <path d="M98 380 C 104 330 150 304 214 300 L 300 300 C 350 302 380 330 384 372 L 386 386 L 98 386 Z"
            fill="url(#shell)" stroke="#2a2f38" stroke-width="7" stroke-linejoin="round"/>
      <path d="M100 380 H 384 V 388 Q 384 398 372 398 H 112 Q 100 398 100 388 Z" fill="#2a2f38"/>
      <path d="M150 350 H 350" stroke="#1aa0ff" stroke-width="8" stroke-linecap="round"/>
      <rect x="226" y="270" width="56" height="34" rx="10" fill="#2a2f38"/>
      <rect x="234" y="278" width="40" height="10" rx="5" fill="#1aa0ff"/>
    </g>

    <!-- Scissors snipping the grass in front of the mower -->
    <g transform="translate(404 404) rotate(222)">
      <g stroke="#3b4350" stroke-width="4" stroke-linejoin="round" fill="url(#blade)">
        <path d="M-4 -10 Q 60 -14 108 -2 L 108 2 Q 60 -2 -4 10 Z" transform="rotate(-13)"/>
        <path d="M-4 -10 Q 60 -2 108 -2 L 108 2 Q 60 14 -4 10 Z" transform="rotate(13)"/>
      </g>
      <g fill="none" stroke="#ff5a3c" stroke-width="11" stroke-linecap="round">
        <path d="M-4 -6 L -22 -16"/>
        <path d="M-4 6 L -22 16"/>
        <ellipse cx="-44" cy="-26" rx="24" ry="17" transform="rotate(-24 -44 -26)"/>
        <ellipse cx="-44" cy="26" rx="24" ry="17" transform="rotate(24 -44 26)"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#3b4350"/>
      <circle cx="0" cy="0" r="3" fill="#c9d1db"/>
    </g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="4"/>
</svg>
